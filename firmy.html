<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moje Firmy">
<meta name="theme-color" content="#0a0a0a">
<title>Moje Firmy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a0a0a'/><text x='90' y='125' font-family='Georgia,serif' font-size='100' font-weight='600' text-anchor='middle' fill='%23d4af37'>F</text></svg>">
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --surface-2: #f2efe7;
    --ink: #1a1814;
    --ink-soft: #4a4640;
    --ink-muted: #8a847a;
    --line: #e5e1d6;
    --accent: #8b6f47;
    --accent-strong: #6b5535;
    --accent-soft: #efe8d8;
    --danger: #b04a3a;
    --success: #4a7c59;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
    --radius: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120e;
      --surface: #1e1c17;
      --surface-2: #2a2720;
      --ink: #f5f1e6;
      --ink-soft: #c4bfb2;
      --ink-muted: #7a7568;
      --line: #2e2b24;
      --accent: #d4af37;
      --accent-strong: #e6c358;
      --accent-soft: #2e2618;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 18px 40px;
  }

  header {
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    font-family: var(--serif);
    font-size: 38px;
    font-weight: 500;
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .brand em {
    color: var(--accent);
    font-style: italic;
    font-weight: 400;
  }

  .count {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    font-weight: 600;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }

  .search {
    flex: 1;
    position: relative;
  }

  .search input {
    width: 100%;
    padding: 15px 16px 15px 44px;
    font-size: 16px;
    font-family: var(--sans);
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search input::placeholder { color: var(--ink-muted); font-weight: 400; }

  .search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted);
    pointer-events: none;
  }

  .btn {
    padding: 15px 18px;
    border: none;
    border-radius: var(--radius);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-muted);
  }

  .empty .icon {
    font-family: var(--serif);
    font-size: 80px;
    color: var(--accent);
    opacity: 0.5;
    line-height: 1;
    margin-bottom: 16px;
    font-style: italic;
    font-weight: 500;
  }

  .empty p {
    font-family: var(--serif);
    font-size: 22px;
    font-style: italic;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .empty span {
    font-size: 14px;
    margin-top: 8px;
    display: block;
  }

  .companies {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .company {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 22px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
    box-shadow: var(--shadow-sm);
  }

  .company:active { transform: scale(0.99); }
  .company:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
  }

  .company-name {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    font-variation-settings: "opsz" 144;
    line-height: 1.2;
    margin-bottom: 6px;
    letter-spacing: -0.015em;
    color: var(--ink);
  }

  .company-nip {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
  }

  .company-form {
    display: inline-block;
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 6px;
    margin-top: 10px;
    font-weight: 600;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fade 0.2s ease;
  }

  .modal-backdrop.show { display: flex; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 640px;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 24px 24px 0 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    animation: slide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 0;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 16px 20px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
    gap: 12px;
  }

  .modal-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.015em;
    line-height: 1.2;
    flex: 1;
    word-break: break-word;
  }

  .close {
    background: var(--surface-2);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: var(--ink);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    line-height: 1;
  }

  .modal-content { padding: 8px 20px 24px; }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .form-group input, .form-group textarea {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    font-family: var(--sans);
    font-weight: 500;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 70px;
    font-family: var(--sans);
  }

  .nip-lookup {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  .nip-lookup input { flex: 1; }

  .nip-lookup button {
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    font-family: var(--sans);
  }

  .nip-lookup button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* DETAIL VIEW */
  .detail-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
  }

  .hero-label {
    font-family: var(--sans);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-muted);
    margin-bottom: 10px;
    font-weight: 700;
  }

  .hero-nip {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 14px;
    word-break: break-all;
  }

  .hero-copy-btn {
    width: 100%;
    padding: 14px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s;
  }

  .hero-copy-btn:active { transform: scale(0.98); }

  .field-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
    position: relative;
  }

  .field-card:active {
    transform: scale(0.99);
    background: var(--surface-2);
  }

  .field-card:hover { border-color: var(--accent); }

  .field-label {
    font-family: var(--sans);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-muted);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .field-value {
    font-family: var(--sans);
    font-size: 17px;
    color: var(--ink);
    font-weight: 500;
    line-height: 1.4;
    word-break: break-word;
    padding-right: 28px;
  }

  .field-value.mono {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .field-value.large {
    font-size: 19px;
  }

  .field-card::after {
    content: '⧉';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    color: var(--ink-muted);
    opacity: 0.5;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 13px;
    font-style: italic;
    font-weight: 500;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin: 24px 0 10px 4px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  .actions .btn { flex: 1; justify-content: center; }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--bg);
    padding: 14px 22px;
    border-radius: 24px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast.error { background: var(--danger); color: white; }
  .toast.success { background: var(--success); color: white; }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .helper-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    margin-top: 14px;
    padding: 14px;
    background: var(--accent-soft);
    border-radius: 10px;
  }

  .helper-link:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Moje <em>Firmy</em></div>
    <div class="count" id="count">0 firm</div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Szukaj firmy lub NIP...">
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Dodaj</button>
  </div>

  <div id="empty" class="empty">
    <div class="icon">F</div>
    <p>Brak zapisanych firm</p>
    <span>Dodaj pierwszą firmę przyciskiem powyżej</span>
  </div>

  <div id="companies" class="companies"></div>
</div>

<div class="modal-backdrop" id="formModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="formTitle">Nowa firma</div>
      <button class="close" onclick="closeFormModal()">×</button>
    </div>
    <div class="modal-content">
      <div class="form-group">
        <label>NIP</label>
        <div class="nip-lookup">
          <input type="text" id="f_nip" placeholder="10 cyfr" inputmode="numeric" maxlength="13">
          <button onclick="lookupNIP()" id="lookupBtn">Pobierz dane</button>
        </div>
        <div style="font-size: 12px; color: var(--ink-muted); margin-top: 8px;">
          Pobiera dane z Białej Listy MF (nazwa, adres, REGON, konta)
        </div>
      </div>

      <div class="form-group">
        <label>Nazwa firmy *</label>
        <input type="text" id="f_name" placeholder="Pełna nazwa firmy">
      </div>

      <div class="form-group">
        <label>Forma prawna</label>
        <input type="text" id="f_form" placeholder="np. Sp. z o.o., S.A.">
      </div>

      <div class="form-group">
        <label>Adres</label>
        <textarea id="f_address" placeholder="Ulica, kod pocztowy, miasto"></textarea>
      </div>

      <div class="form-group">
        <label>REGON</label>
        <input type="text" id="f_regon" placeholder="9 lub 14 cyfr" inputmode="numeric">
      </div>

      <div class="form-group">
        <label>KRS</label>
        <input type="text" id="f_krs" placeholder="10 cyfr" inputmode="numeric">
      </div>

      <div class="form-group">
        <label>Kapitał zakładowy</label>
        <input type="text" id="f_capital" placeholder="np. 50 000 zł">
      </div>

      <div class="form-group">
        <label>Numer konta</label>
        <input type="text" id="f_bank" placeholder="26 cyfr (IBAN bez PL)" inputmode="numeric">
      </div>

      <div class="form-group">
        <label>Notatki</label>
        <textarea id="f_notes" placeholder="Dodatkowe informacje (e-mail, telefon, www...)"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="closeFormModal()">Anuluj</button>
        <button class="btn btn-primary" onclick="saveCompany()">Zapisz</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title" id="d_name">Firma</div>
      <button class="close" onclick="closeDetailModal()">×</button>
    </div>
    <div class="modal-content" id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'moje_firmy_v1';
  let companies = [];
  let editingId = null;

  function loadCompanies() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      companies = data ? JSON.parse(data) : [];
    } catch(e) { companies = []; }
  }

  function saveCompanies() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(companies));
  }

  let toastTimer;
  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = 'toast ' + type, 2200);
  }

  function render() {
    const list = document.getElementById('companies');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const search = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = companies.filter(c => {
      if (!search) return true;
      return (c.name || '').toLowerCase().includes(search) ||
             (c.nip || '').replace(/\D/g,'').includes(search.replace(/\D/g,''));
    });

    count.textContent = companies.length === 1 ? '1 firma' :
                       (companies.length >= 2 && companies.length <= 4) ? companies.length + ' firmy' :
                       companies.length + ' firm';

    if (companies.length === 0) {
      empty.style.display = 'block';
      list.innerHTML = '';
      return;
    }

    empty.style.display = 'none';

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty"><p style="font-size:18px">Nie znaleziono</p></div>';
      return;
    }

    list.innerHTML = filtered.map(c => `
      <div class="company" onclick="showDetail('${c.id}')">
        <div class="company-name">${escapeHtml(c.name || 'Bez nazwy')}</div>
        <div class="company-nip">NIP ${formatNIP(c.nip)}</div>
        ${c.form ? `<span class="company-form">${escapeHtml(c.form)}</span>` : ''}
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function formatNIP(nip) {
    if (!nip) return '—';
    const clean = nip.replace(/\D/g, '');
    if (clean.length === 10) {
      return `${clean.slice(0,3)}-${clean.slice(3,6)}-${clean.slice(6,8)}-${clean.slice(8,10)}`;
    }
    return nip;
  }

  function formatBank(bank) {
    if (!bank) return '';
    const clean = bank.replace(/\s/g, '');
    return clean.replace(/(.{4})/g, '$1 ').trim();
  }

  function openAddModal() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'Nowa firma';
    ['f_nip','f_name','f_form','f_address','f_regon','f_krs','f_capital','f_bank','f_notes'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('formModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function openEditModal(id) {
    const c = companies.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edytuj firmę';
    document.getElementById('f_nip').value = c.nip || '';
    document.getElementById('f_name').value = c.name || '';
    document.getElementById('f_form').value = c.form || '';
    document.getElementById('f_address').value = c.address || '';
    document.getElementById('f_regon').value = c.regon || '';
    document.getElementById('f_krs').value = c.krs || '';
    document.getElementById('f_capital').value = c.capital || '';
    document.getElementById('f_bank').value = c.bank || '';
    document.getElementById('f_notes').value = c.notes || '';
    closeDetailModal();
    document.getElementById('formModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeFormModal() {
    document.getElementById('formModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function saveCompany() {
    const name = document.getElementById('f_name').value.trim();
    if (!name) {
      toast('Nazwa firmy jest wymagana', 'error');
      return;
    }

    const data = {
      id: editingId || Date.now().toString(),
      nip: document.getElementById('f_nip').value.replace(/\D/g, ''),
      name: name,
      form: document.getElementById('f_form').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      regon: document.getElementById('f_regon').value.replace(/\D/g, ''),
      krs: document.getElementById('f_krs').value.replace(/\D/g, ''),
      capital: document.getElementById('f_capital').value.trim(),
      bank: document.getElementById('f_bank').value.replace(/\s/g, ''),
      notes: document.getElementById('f_notes').value.trim(),
      banks: editingId ? (companies.find(c => c.id === editingId)?.banks || []) : []
    };

    if (editingId) {
      const idx = companies.findIndex(c => c.id === editingId);
      if (idx !== -1) {
        data.banks = companies[idx].banks || data.banks;
        companies[idx] = data;
      }
    } else {
      companies.unshift(data);
    }

    saveCompanies();
    render();
    closeFormModal();
    toast(editingId ? 'Zapisano zmiany' : 'Dodano firmę', 'success');
  }

  function deleteCompany(id) {
    if (!confirm('Czy na pewno usunąć tę firmę?')) return;
    companies = companies.filter(c => c.id !== id);
    saveCompanies();
    render();
    closeDetailModal();
    toast('Usunięto firmę');
  }

  async function lookupNIP() {
    const nipInput = document.getElementById('f_nip');
    const nip = nipInput.value.replace(/\D/g, '');
    const btn = document.getElementById('lookupBtn');

    if (nip.length !== 10) {
      toast('NIP musi mieć 10 cyfr', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';

    try {
      const today = new Date().toISOString().split('T')[0];
      const url = `https://wl-api.mf.gov.pl/api/search/nip/${nip}?date=${today}`;
      const res = await fetch(url);

      if (!res.ok) throw new Error('Nie znaleziono');

      const json = await res.json();
      const subject = json.result?.subject;

      if (!subject) {
        toast('Nie znaleziono firmy o tym NIP', 'error');
        return;
      }

      const fullName = subject.name || '';
      const formMatch = fullName.match(/(Sp\. z o\.o\.|S\.A\.|Sp\. k\.|Sp\.j\.|S\.K\.A\.|Sp\. komandytowa|Spółka Akcyjna|Spółka z ograniczoną odpowiedzialnością|Fundacja|Stowarzyszenie)/i);

      document.getElementById('f_name').value = fullName;
      if (formMatch) {
        document.getElementById('f_form').value = formMatch[0];
      }

      const addr = [subject.workingAddress || subject.residenceAddress].filter(Boolean).join(', ');
      if (addr) document.getElementById('f_address').value = addr;

      if (subject.regon) document.getElementById('f_regon').value = subject.regon;
      if (subject.krs) document.getElementById('f_krs').value = subject.krs;

      if (subject.accountNumbers && subject.accountNumbers.length > 0) {
        document.getElementById('f_bank').value = subject.accountNumbers[0];
        window._tempBanks = subject.accountNumbers;
      }

      toast('Pobrano dane z Białej Listy', 'success');
    } catch (err) {
      toast('Błąd pobierania. Sprawdź NIP lub połączenie', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Pobierz dane';
    }
  }

  function showDetail(id) {
    const c = companies.find(x => x.id === id);
    if (!c) return;

    document.getElementById('d_name').textContent = c.name || 'Bez nazwy';

    let html = '';

    if (c.nip) {
      const nipFormatted = formatNIP(c.nip);
      html += `
        <div class="detail-hero">
          <div class="hero-label">NIP</div>
          <div class="hero-nip">${nipFormatted}</div>
          <button class="hero-copy-btn" onclick="copyText('${c.nip}', 'NIP skopiowany')">
            Skopiuj NIP
          </button>
        </div>
      `;
    }

    if (c.form) html += makeFieldCard('Forma prawna', c.form, c.form, false, true);
    if (c.address) html += makeFieldCard('Adres', c.address, c.address, false, true);
    if (c.regon) html += makeFieldCard('REGON', c.regon, c.regon, true);
    if (c.krs) html += makeFieldCard('KRS', c.krs, c.krs, true);
    if (c.capital) html += makeFieldCard('Kapitał zakładowy', c.capital, c.capital, false, true);

    if (c.bank) {
      html += `<div class="section-title">Konto bankowe</div>`;
      html += makeFieldCard('Numer konta', formatBank(c.bank), c.bank, true);
    }

    if (c.banks && c.banks.length > 1) {
      const otherBanks = c.banks.slice(1);
      otherBanks.forEach(b => {
        html += makeFieldCard('Kolejne konto', formatBank(b), b, true);
      });
    }

    if (c.notes) {
      html += `<div class="section-title">Notatki</div>`;
      html += makeFieldCard('Notatki', c.notes, c.notes, false, true);
    }

    const allData = buildAllData(c);
    html += `
      <div style="margin-top: 22px;">
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:16px;" onclick="copyText(\`${escapeBackticks(allData)}\`, 'Skopiowano wszystkie dane')">
          Skopiuj wszystkie dane do faktury
        </button>
      </div>
    `;

    if (c.krs) {
      html += `
        <a class="helper-link" href="https://wyszukiwarka-krs.ms.gov.pl/?krs=${c.krs}" target="_blank" rel="noopener">
          Otwórz w wyszukiwarce KRS →
        </a>
      `;
    } else if (c.nip) {
      html += `
        <a class="helper-link" href="https://wyszukiwarka-krs.ms.gov.pl/" target="_blank" rel="noopener">
          Wyszukaj w KRS →
        </a>
      `;
    }

    html += `
      <div class="actions">
        <button class="btn btn-secondary" onclick="openEditModal('${c.id}')">Edytuj</button>
        <button class="btn btn-danger" onclick="deleteCompany('${c.id}')">Usuń</button>
      </div>
    `;

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function makeFieldCard(label, display, copyValue, mono = false, large = false) {
    const safeCopy = String(copyValue).replace(/`/g, '\\`').replace(/\$/g, '\\$');
    const valueClass = mono ? 'mono' : (large ? 'large' : '');
    return `
      <div class="field-card" onclick="copyText(\`${safeCopy}\`, '${label} skopiowane')">
        <div class="field-label">${label}</div>
        <div class="field-value ${valueClass}">${escapeHtml(display)}</div>
      </div>
    `;
  }

  function escapeBackticks(s) {
    return String(s).replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  function buildAllData(c) {
    const parts = [];
    if (c.name) parts.push(c.name);
    if (c.address) parts.push(c.address);
    if (c.nip) parts.push('NIP: ' + c.nip);
    if (c.regon) parts.push('REGON: ' + c.regon);
    if (c.krs) parts.push('KRS: ' + c.krs);
    if (c.capital) parts.push('Kapitał zakładowy: ' + c.capital);
    if (c.bank) parts.push('Konto: ' + formatBank(c.bank));
    return parts.join('\n');
  }

  function closeDetailModal() {
    document.getElementById('detailModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  async function copyText(text, msg) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      toast(msg || 'Skopiowano', 'success');
      if (navigator.vibrate) navigator.vibrate(10);
    } catch(e) {
      toast('Nie udało się skopiować', 'error');
    }
  }

  document.getElementById('searchInput').addEventListener('input', render);

  document.getElementById('formModal').addEventListener('click', e => {
    if (e.target.id === 'formModal') closeFormModal();
  });
  document.getElementById('detailModal').addEventListener('click', e => {
    if (e.target.id === 'detailModal') closeDetailModal();
  });

  loadCompanies();
  render();
</script>
</body>
</html>
